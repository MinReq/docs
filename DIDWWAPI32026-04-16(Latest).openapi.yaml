    post:
      summary: Create Voice OUT Trunk
      deprecated: false
      description: >-
        <h1 id="create-voice-out-trunk"></h1>


        Creates a voice out trunk.


        #### Request Body Scheme


        > `{`

        > 

        > > **data** (*object, required*) `{`

        > > 

        > > > **type** (*string, required*): **voice_out_trunks**  

        > > > Trunks

        > > 

        > > > **attributes** (*object, required*) `{`  

        > > > Trunk configuration complex object.

        > > > 

        > > > > **name** (*string, required, NOT nullable*)  

        > > > > The voice out trunk name.

        > > > 

        > > > > **on_cli_mismatch_action** (*enumerate[string], required, NOT
        nullable*): **send_original_cli**, **reject_call**  

        > > > > Possible values are:

        > > > > *send_original_cli* - the system will pass the `FROM` header
        value to the termination gateway.

        > > > > *reject_call* - the system will reject the call if the `FROM`
        header value does not match any of the allowed DIDs.

        > > >  

        > > > > **capacity_limit** (*integer, NOT required, nullable*): 

        > > > > The capacity limit of the voice out trunk. Allowed values from 0
        to 32767.

        > > >  

        > > > > **allow_any_did_as_cli** (*boolean, NOT required, NOT
        nullable*): 

        > > > > When set to `True`, passed than DIDs relationship can not be set
        to explicit DIDs. if DIDs relationship is omitted in payload already
        linked DIDs will be automatically unassigned. 

        > > > > Default value is `false`.

        > > >  

        > > > > **status** (*enumerate[string], NOT required, NOT nullable*):
        **active**, **blocked**

        > > > > Can be either: *active* or *blocked*. 

        > > > > Default value is `active`.

        > > >  

        > > > > **threshold_amount** (*string, NOT required, NOT nullable*): 

        > > > > The outbound trunk 24 hour threshold limit. Can be from 0.0 to
        100000.0.

        > > >  

        > > > > **default_dst_action** (*enumerate[string], NOT required, NOT
        nullable*): **allow_all**, **reject_all**

        > > > > Can be either: *allow_all* or *reject_all*.

        > > > > Default value is `allow_all`.

        > > >  

        > > > > **dst_prefixes** (*array[string], NOT required, nullable*)

        > > > > The allowed destination prefixes.

        > > >  

        > > > > **media_encryption_mode** (*enumerate[string], NOT required, NOT
        nullable*): **disabled**, **srtp_sdes**, **srtp_dtls**, **zrtp**

        > > > > Media encryption mode.

        > > > > See [RFC4568 about SRTP
        SDES](https://datatracker.ietf.org/doc/html/rfc4568), [RFC5764 about
        SRTP DTLS](https://datatracker.ietf.org/doc/html/rfc5764), and [RFC6189
        about ZRTP](https://datatracker.ietf.org/doc/html/rfc6189) for more
        details.

        > > > > Possible values:

        > > > > *disabled* - Disabled

        > > > > *srtp_sdes* - SRTP SDES

        > > > > *srtp_dtls* - SRTP DTLS

        > > > > *zrtp* - ZRTP

        > > >  

        > > > > **callback_url** (*string, NOT required, nullable*)

        > > > > Can be null or valid HTTP(s) URL.

        > > > 

        > > > > **force_symmetric_rtp** (*boolean, NOT required, NOT nullable*)

        > > > > Forced to work in Symmetric RTP / COMEDIA mode.

        > > > > Default value is `false`.

        > > >  

        > > > > **rtp_ping** (*boolean, NOT required, NOT nullable*)

        > > > > Use RTP PING when connecting a call.

        > > > > After establishing the call, DIDWW will send empty RTP packet
        RTP PING.

        > > > > It is necessary if both parties operate in Symmetric RTP /
        Comedia mode and expect the other party to start sending RTP first.

        > > > > Default value is `false`.

        > > >

        > > > > **emergency_enable_all** (*boolean, NOT required, NOT nullable*)

        > > > > When set to `true`, all emergency-enabled DIDs will be
        automatically linked to the trunk.

        > > > > Default value is `false`.

        > > > 

        > > > > **external_reference_id** (*string, optional*)  

        > > > > Identifier for Voice Out Trunk in external system.

        > > > 

        > > > > **rtp_timeout** (*integer, NOT required, NOT nullable*)  

        > > > > RTP timeout in seconds. Allowed values from 30 to 600.

        > > > > Default value is `30`.

        > > > 

        > > > > **authentication_method** (*object, required*) `{`  

        > > > > Authentication method configuration.

        > > > > 

        > > > > > **type** (*string, required*): **credentials_and_ip**,
        **twilio**  

        > > > > > Authentication method type. Note: `ip_only` is not allowed for
        creation.

        > > > > 

        > > > > > **attributes** (*object, required*) `{`

        > > > > > 

        > > > > > > **allowed_sip_ips** (*array[string], NOT required,
        nullable*)  

        > > > > > > The allowed originating IPs. Array from 0 to 15 items: IP
        v4/v6 single or subnet.  

        > > > > > > Required for `ip_only` and `credentials_and_ip` types.

        > > > > > 

        > > > > > > **tech_prefix** (*string, NOT required, nullable*)  

        > > > > > > Technical prefix prepended to the destination number.
        Allowed only digits and `#`, max 8 characters.  

        > > > > > > Available for `ip_only` and `credentials_and_ip` types.

        > > > > > 

        > > > > > > **twilio_account_sid** (*string, NOT required, nullable*)  

        > > > > > > Twilio Account SID. Required for `twilio` type.

        > > > > > 

        > > > > > `}`

        > > > > 

        > > > > `}`

        > > >  

        > > > `}`

        > > 

        > > > **relationships** (*object, optional*) `{`

        > > > 

        > > > > **dids** (*object, optional*):
        [***to-many***](#updating-to-many-relationships)  

        > > > > Linkage for included [DID Object](#did-object)

        > > > > The DID numbers if `allow_any_did_as_cli` is set to `false`.

        > > > 

        > > > > **emergency_dids** (*object, optional*):
        [***to-many***](#updating-to-many-relationships)  

        > > > > Linkage for included [DID Object](#did-object)

        > > > > The emergency DID numbers. Cannot be set if
        `emergency_enable_all` is `true`.

        > > > > Specify individual DIDs to enable for emergency calls when
        `emergency_enable_all` is `false`.

        > > > 

        > > > `}`

        > > 

        > > `}`

        > 

        > `}`


        #### Request Body Example:


        ###### Voice OUT trunk


        ``` json

        {
          "data": {
            "type": "voice_out_trunks",
            "attributes": {
              "name": "Outbound trunk 11",
              "on_cli_mismatch_action": "send_original_cli",
              "capacity_limit": 100,
              "allow_any_did_as_cli": true,
              "status": "active",
              "threshold_amount": "9999.0",
              "default_dst_action": "allow_all",
              "dst_prefixes": ["23"],
              "media_encryption_mode": "disabled",
              "allowed_rtp_ips": ["192.168.1.1"],
              "force_symmetric_rtp": false,
              "rtp_ping": false,
              "rtp_timeout": 30,
              "emergency_enable_all": false,
              "authentication_method": {
                "type": "credentials_and_ip",
                "attributes": {
                  "allowed_sip_ips": ["192.168.1.1"],
                  "tech_prefix": null
                }
              }
            }
          }
        }

        ```


        ###### Voice OUT trunk with specific emergency DIDs
        (`emergency_enable_all: false`)


        ``` json

        {
          "data": {
            "type": "voice_out_trunks",
            "relationships": {
              "emergency_dids": {
                "data": [
                  {
                    "id": "f10d40c7-fd0b-4d63-bb9b-27810a1a8f5c",
                    "type": "dids"
                  },
                  {
                    "id": "a2b3c4d5-e6f7-8901-abcd-ef1234567890",
                    "type": "dids"
                  }
                ]
              }
            }
          }
        }

        ```
