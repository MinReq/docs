    patch:
      summary: Update DID
      deprecated: false
      description: >-
        <h1 id="update-did"></h1>


        Update the settings of a single DID owned by your account. Using this
        endpoint you can cancel, restore or renew DID.


        To cancel a DID, attribute `terminated` must be `true`, to renew or
        restore DID attribute `terminated` must be `false`.


        #### Request Body Scheme


        > `{`

        > 

        > > **data** (*object, required*) `{`

        > > 

        > > > **id** (*string, required*)  

        > > > Unique ID number allocated to this DID.

        > > 

        > > > **type** (*string, required*): **dids**

        > > 

        > > > **attributes** (*object, optional*) `{`

        > > > 

        > > > > **terminated** (*boolean, optional*)  

        > > > > If set to `True`, it will cancel a DID number. To renew or
        restore a DID number, the attribute must be set to `False`.

        > > > 

        > > > > **description** (*string, optional*)  

        > > > > A DID number description.

        > > > 

        > > > > **billing_cycles_count** (*integer, optional*)  

        > > > > The number of Billing Cycles that this DID Number will renew
        until expiration.  

        > > > > `null` value means that DID will be renewed infinitely. `0`
        value means that DID will not be renewed. `2` value means that DID will
        be renewed only twice. After each renew value will be decreased by 1 if
        it is set. Value can be set from `0` to `999`.

        > > > 

        > > > > **dedicated_channels_count** (*integer, optional*)  

        > > > > Amount of channels to be assigned to curent DID from allocated
        in relationships Capacity Pool  

        > > > > Should be used with one of optional relationship `capacity_pool`

        > > > 

        > > > `}`

        > > 

        > > > **relationships** (*object, optional*) `{`

        > > > 

        > > > > **voice_in_trunk** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Voice In Trunk
        Object](#voice-in-trunk-object)

        > > > 

        > > > > **voice_in_trunk_group** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Voice In Trunk Group
        Object](#voice-in-trunk-group-object)

        > > > 

        > > > > **capacity_pool** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Capacity Pool
        Object](#capacity-pool-object)

        > > > 

        > > > > **shared_capacity_group** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Shared Capacity Group
        Object](#shared-capacity-group-object)

        > > > 

        > > > > **emergency_calling_service** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

