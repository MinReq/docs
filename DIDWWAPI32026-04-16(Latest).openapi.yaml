    patch:
      summary: Update PSTN Trunk
      deprecated: false
      description: >-
        <h1 id="update-pstn-trunk"></h1>


        #### Request Body


        > `{`

        > 

        > > **data** (*object, required*) `{`

        > > 

        > > > **id** (*string, required*)  

        > > > Unique ID identifier of Trunk.

        > > 

        > > > **type** (*string, required*): **voice_in_trunks**  

        > > > Trunks

        > > 

        > > > **attributes** (*object, required*) `{`  

        > > > Trunk configuration complex object.

        > > > 

        > > > > **external_reference_id** (*string, optional*)  

        > > > > Identifier for Voice IN Trunk in external system.

        > > > 

        > > > > **priority** (*integer, required*)  

        > > > > The priority of this target host. DIDWW will attempt to contact
        the target trunk with the lowest-numbered priority; target trunk with
        the same priority will be tried in an order defined by the weight field.
        The range is 0-65535. See [RFC
        2782](https://tools.ietf.org/html/rfc2782) for more details.

        > > > 

        > > > > **weight** (*integer, required*)  

        > > > > A trunk selection mechanism. The weight field specifies a
        relative weight for entries with the same priority. Larger weights will
        be given a proportionately higher probability of being selected. The
        range of this number is 0-65535. In the presence of records containing
        weights greater than 0, records with weight 0 will have a very small
        chance of being selected. See [RFC
        2782](https://tools.ietf.org/html/rfc2782) for more details.

        > > > 

        > > > > **capacity_limit** (*integer, required*)  

        > > > > Maximum number of simultaneous calls for the trunk.

        > > > 

        > > > > **ringing_timeout** (*integer, required*)  

        > > > > After which it will be end transaction with internal disconnect
        code Ringing timeout if the call was not connected.

        > > > 

        > > > > **name** (*string, required*)  

        > > > > Friendly name of the trunk.

        > > > 

        > > > > **cli_format** (*string, required*): ***RAW***, ***E164***,
        ***Local***  

        > > > > *RAW* - Do not alter CLI (default).  

        > > > > *E164* - Attempt to convert CLI to E.164 format.  

        > > > > *Local* - Attempt to convert CLI to Localized format.

        > > > > 

        > > > > *CLI format conversion may not work correctly for phone calls
        originating from outside the country of that specific DID.*

        > > > 

        > > > > **cli_prefix** (*string, required*)  

        > > > > You may prefix the CLI with an optional `+` sign followed by up
        to 6 characters, including digits and `#`.

        > > > 

        > > > > **description** (*string, optional*)  

        > > > > Optional description of the trunk.

        > > > 

        > > > > **configuration** (*object, required*) `{`  

        > > > > Trunk configuration complex object.

        > > > > 

        > > > > > **type** (*string, required*): ***pstn_configurations***  

        > > > > > PSTN configuration complex object.

        > > > > 

        > > > > > **attributes** (*object, required*) `{`  

        > > > > > PSTN configuration attributes object.

        > > > > > 

        > > > > > > **dst** (*string, optional*)  

        > > > > > > Phone number’s.

        > > > > > 

        > > > > > `}`

        > > > > 

        > > > > `}`

        > > > 

        > > > `}`

        > > 

        > > > **relationships** (*object, optional*) `{`

        > > > 

        > > > > **pop** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [POP Object](#pop-object)

        > > > 

        > > > > **voice_in_trunk_group** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Voice In Trunk Group
        Object](#voice-in-trunk-group-object)

        > > > 

        > > > `}`

        > > 

        > > `}`

        > 

        > `}`


        #### Request Body Example:


        ``` json

        {
            "data": {
                "id": "57a939dd-1600-41a6-80b1-f624e22a1f4c",
                "type": "voice_in_trunks",
                "attributes": {
                    "name": "Office Mobile",
