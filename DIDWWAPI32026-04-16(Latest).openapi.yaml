paths:
  /v3/countries/{id}:
    get:
      summary: Get Country
      deprecated: false
      description: >-
        <h1 id="get-country"></h1>


        Returns a country for a given country ID number. Note that a unique
        identification number is allocated to each country included in the DIDWW
        coverage.
      tags:
        - Coverage Resources/Countries
      parameters:
        - name: id
          in: path
          description: Unique ID number for the country
          required: true
          example: <uuid>
          schema:
            type: string
        - name: Accept
          in: header
          description: ''
          required: true
          example: application/vnd.api+json
          schema:
            type: string
        - name: Content-Type
          in: header
          description: ''
          required: true
          example: application/vnd.api+json
          schema:
            type: string
        - name: Api-Key
          in: header
          description: ''
          required: true
          example: '{{apiKey}}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                          prefix:
                            type: string
                          iso:
                            type: string
                        required:
                          - name
                          - prefix
                          - iso
                      relationships:
                        type: object
                        properties:
                          regions:
                            type: object
                            properties:
                              links:
                                type: object
                                properties:
                                  self:
                                    type: string
                                  related:
                                    type: string
                                required:
                                  - self
                                  - related
                            required:
                              - links
                        required:
                          - regions
                    required:
                      - id
                      - type
                      - attributes
                      - relationships
                  meta:
                    type: object
                    properties:
                      api_version:
                        type: string
                    required:
                      - api_version
                required:
                  - data
                  - meta
              example:
                data:
                  id: e352699c-3764-415b-8946-dd470c1e0ed7
                  type: countries
                  attributes:
                    name: United Kingdom
                    prefix: '44'
                    iso: GB
                  relationships:
                    regions:
                      links:
                        self: >-
                          https://api.didww.com/v3/countries/e352699c-3764-415b-8946-dd470c1e0ed7/relationships/regions
                        related: >-
                          https://api.didww.com/v3/countries/e352699c-3764-415b-8946-dd470c1e0ed7/regions
                meta:
                  api_version: '2026-04-16'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        code:
                          type: string
                        status:
                          type: string
                required:
                  - errors
              example:
                errors:
                  - title: Record not found
                    detail: >-
                      The record identified by
                      e352699c-3764-415b-8946-dd470c1e0ed7 could not be found.
                    code: '404'
                    status: '404'
      security: []
  /v3/countries:
    get:
      summary: Get Countries
      deprecated: false
      description: |-
        <h1 id="get-countries"></h1>

        Returns a list of countries. [Pagination](#pagination) is disabled.
      tags:
        - Coverage Resources/Countries
      parameters:
        - name: filter[id]
          in: query
          description: |-
            `string` - Filters by country id field. 

            * **Allow blank** - *No*. 
            * **Allow array** - *Yes*. 
          required: false
          example: ''
          schema:
            type: string
        - name: filter[name]
          in: query
          description: |-
            `string` - Filters by country name field. Case insensitive. 

            * **Allow blank** - *Yes*. 
            * **Allow array** - *Yes*. 
          required: false
          example: ''
          schema:
            type: string
        - name: filter[prefix]
          in: query
          description: |-
            `string` - Filters by country prefix field. 

            * **Allow blank** - *Yes*. 
            * **Allow array** - *Yes*. 
          required: false
          example: ''
          schema:
            type: string
        - name: filter[iso]
          in: query
          description: |-
            `string` - Filters by country iso field. 

            * **Allow blank** - *Yes*. 
            * **Allow array** - *Yes*.
          required: false
          example: ''
          schema:
            type: string
        - name: filter[is_available]
          in: query
          description: >-
            `boolean` - When true, shows countries which have DID groups in
            coverage with DID numbers available for purchase. When false shows
            countries which have DID groups without DID numbers available for
            purchase. 

            * **Allow blank** - *No*. 

            * **Allow array** - *No*. 
          required: false
          example: ''
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            Used for sorting the fields returned by the request, with a comma
            `,` separating the included fields.

            Details in [Sorting](#sorting) Article.


            **name** - Country `name` field

            ***

            **prefix** - Country `prefix` field

            ***

            **iso** - Country `iso` field

            ***
          required: false
          example: ''
          schema:
            type: string
        - name: Accept
          in: header
          description: ''
          required: true
          example: application/vnd.api+json
          schema:
            type: string
        - name: Content-Type
          in: header
          description: ''
          required: true
          example: application/vnd.api+json
          schema:
            type: string
        - name: Api-Key
          in: header
          description: ''
          required: true
          example: '{{apiKey}}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                            prefix:
                              type: string
                            iso:
                              type: string
                          required:
                            - name
                            - prefix
                            - iso
                        relationships:
                          type: object
                          properties:
                            regions:
                              type: object
                              properties:
                                links:
                                  type: object
                                  properties:
                                    self:
                                      type: string
                                    related:
                                      type: string
                                  required:
                                    - self
                                    - related
                              required:
                                - links
                          required:
                            - regions
                      required:
                        - id
                        - type
                        - attributes
                        - relationships
                  meta:
                    type: object
                    properties:
                      api_version:
                        type: string
                    required:
                      - api_version
                required:
                  - data
                  - meta
              example:
                data:
                  - id: 9c56fe0f-eff0-4742-85f6-24868959344a
                    type: countries
                    attributes:
                      name: United Kingdom
                      prefix: '44'
                      iso: GB
                    relationships:
                      regions:
                        links:
                          self: >-
                            https://api.didww.com/v3/countries/9c56fe0f-eff0-4742-85f6-24868959344a/relationships/regions
                          related: >-
                            https://api.didww.com/v3/countries/9c56fe0f-eff0-4742-85f6-24868959344a/regions
                  - id: 5d3d7640-16d2-4dc0-9aca-408789fbefc6
                    type: countries
                    attributes:
                      name: United States
                      prefix: '1'
                      iso: US
                    relationships:
                      regions:
                        links:
                          self: >-
                            https://api.didww.com/v3/countries/5d3d7640-16d2-4dc0-9aca-408789fbefc6/relationships/regions
                          related: >-
                            https://api.didww.com/v3/countries/5d3d7640-16d2-4dc0-9aca-408789fbefc6/regions
                meta:
                  api_version: '2026-04-16'
      security: []
  /v3/regions/{id}:
    get:
      summary: Get Region
      deprecated: false
      description: |-
        <h1 id="get-region"></h1>

