    post:
      summary: Create Address
      deprecated: false
      description: >-
        <h1 id="create-address"></h1>


        Creates an Address that can be assigned to an Identity.


        #### Request Body Scheme


        > `{`

        > 

        > > **data** (*object, required*) `{`

        > > 

        > > > **type** (*string, required*): **addresses**

        > > 

        > > > **attributes** (*object, required*) `{`

        > > > 

        > > > > **city_name** (*string, required*)  

        > > > > City name of the address.

        > > > 

        > > > > **postal_code** (*string, required*)  

        > > > > Postal code of the address.

        > > > 

        > > > > **address** (*string, required*)  

        > > > > Full address.

        > > > 

        > > > > **description** (*string, optional*)  

        > > > > The description of the address.

        > > > 

        > > > > **external_reference_id** (*string, optional*)  

        > > > > Identifier for Address in external system.

        > > > 

        > > > `}`

        > > 

        > > > **relationships** (*object, required*) `{`

        > > > 

        > > > > **identity** (*object, required*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Specifies the [*Identity*](#identity-object) for the address.

        > > > 

        > > > > **country** (*object , required*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Specifies the [*Country*](#country-object) for the address.

        > > > 

        > > > `}`

        > > 

        > > `}`

        > 

        > `}`


        #### Request Body Example


        ###### Simple Resource Patch


        ``` json

        {
          "data": {
            "type": "addresses",
            "attributes": {
              "city_name": "string",
              "postal_code": "string",
              "address": "string",
              "description": "string"
            },
