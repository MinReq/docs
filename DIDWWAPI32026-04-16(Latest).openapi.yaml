          schema:
            type: string
        - name: Api-Key
          in: header
          description: ''
          required: true
          example: '{{apiKey}}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      attributes:
                        type: object
                        properties:
                          name:
                            type: string
                        required:
                          - name
                      relationships:
                        type: object
                        properties:
                          country:
                            type: object
                            properties:
                              links:
                                type: object
                                properties:
                                  self:
                                    type: string
                                  related:
                                    type: string
                                required:
                                  - self
                                  - related
                            required:
                              - links
                        required:
                          - country
                    required:
                      - id
                      - type
                      - attributes
                      - relationships
                  meta:
                    type: object
                    properties:
                      api_version:
                        type: string
                    required:
                      - api_version
                required:
                  - data
                  - meta
              example:
                data:
                  id: 8ce33ee2-73da-4baa-85a0-cd607d0e9733
                  type: regions
                  attributes:
                    name: Alberta
                  relationships:
                    country:
                      links:
                        self: >-
                          https://api.didww.com/v3/regions/8ce33ee2-73da-4baa-85a0-cd607d0e9733/relationships/country
                        related: >-
                          https://api.didww.com/v3/regions/8ce33ee2-73da-4baa-85a0-cd607d0e9733/country
                meta:
                  api_version: '2026-04-16'
        '401':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        code:
                          type: string
                        status:
                          type: string
                required:
                  - errors
              example:
                errors:
                  - title: Unauthorized
                    detail: Authorization failed
                    code: '401'
                    status: '401'
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        detail:
                          type: string
                        code:
                          type: string
                        status:
                          type: string
                required:
                  - errors
              example:
                errors:
                  - title: Record not found
                    detail: >-
                      The record identified by
                      8ce33ee2-73da-4baa-85a0-cd607d0e9700 could not be found.
                    code: '404'
                    status: '404'
      security: []
