    patch:
      summary: Update Business Identity
      deprecated: false
      description: >-
        <h1 id="update-business-identity"></h1>


        Update the settings of a single Identity owned by your account.


        #### Request Body Scheme


        > `{`

        > 

        > > **data** (*object, required*) `{`

        > > 

        > > > **id** (*string, required*)  

        > > > Unique ID identifier of Identity.

        > > 

        > > > **type** (*string, required*): **identities**

        > > 

        > > > **attributes** (*object, required*) `{`

        > > > 

        > > > > **company_name** (*string, required*)  

        > > > > Company name of the business identity.

        > > > 

        > > > > **company_reg_number** (*string, optional*)  

        > > > > Company registration number of the business identity.

        > > > 

        > > > > **vat_id** (*string, optional*)  

        > > > > Company VAT ID of the business identity.

        > > > 

        > > > > **first_name** (*string, required*)  

        > > > > Company’s representative First name of the business identity.

        > > > 

        > > > > **last_name** (*string, required*)  

        > > > > Company’s representative Last name of the business identity.

        > > > 

        > > > > **phone_number** (*string, required*)  

        > > > > Company’s representative Phone number of the business identity.
        Only digits allowed.

        > > > 

        > > > > **personal_tax_id** (*string, optional*)  

        > > > > Company’s representative Tax ID of the business identity.

        > > > 

        > > > > **birth_date** (*DateTime\[string\], optional*)  

        > > > > Company’s representative Birth date of the business identity.

        > > > 

        > > > > **id_number** (*string, optional*)  

        > > > > Company’s representative ID number of the business identity.

        > > > 

        > > > > **description** (*string, optional*)  

        > > > > Description of the business identity.

        > > > 

        > > > > **external_reference_id** (*string, optional*)  

        > > > > Identifier for identity in external system

        > > > 

        > > > > **contact_email** (*string, optional*)  

        > > > > Contact email of the business identity.

        > > > 

        > > > `}`

        > > 

        > > > **relationships** (*object, optional*) `{`

        > > > 

        > > > > **country** (*object, required*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Country Object](#country-object)  

        > > > > Specifies the country for identity.

        > > > 

        > > > > **birth_country** (*object, optional*):
        [***to-one***](#updating-to-one-relationships)  

        > > > > Linkage for included [Country Object](#country-object)  

        > > > > Specifies the birth country for identity.

        > > > 

        > > > `}`

        > > 

        > > `}`

        > 

        > `}`


        #### Request Body Example


        ``` json

        {
            "data": {
                "type": "identities",
                "attributes": {
                    "first_name": "string",
                    "last_name": "string",
                    "phone_number": "string",
                    "id_number": "string",
                    "birth_date": "string",
                    "company_name": "string",
                    "company_reg_number": "string",
                    "vat_id": "string",
                    "description": "string",
                    "personal_tax_id": "string",
                    "contact_email": "user@example.com"
                },
                "relationships": {
                    "country": {
                        "data": {
                            "id": "6d0effab-3fe3-4e07-acc6-1d3ddc717ebc",
                            "type": "countries"
                        }
                    },
                    "birth_country": {
                        "data": {
                            "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                            "type": "countries"
                        }
                    }
                }
            }
        }


        ```
